
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold
        run: |
          flutter create --platforms=android --org com.dutyhisab --project-name duty_hisab .
          git checkout -- lib pubspec.yaml || true
          sed -i 's/android:label="[^"]*"/android:label="ডিউটি হিসাব"/' android/app/src/main/AndroidManifest.xml

      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: duty-hisab-apk
          path: build/app/outputs/flutter-apk/app-release.apk
